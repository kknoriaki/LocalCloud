name: Move LocalCloud to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move files to repository root
        run: |
          shopt -s dotglob nullglob
          cp -a LocalCloud/. .
          rm -rf LocalCloud

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move LocalCloud source files to repository root" || exit 0
          git push
